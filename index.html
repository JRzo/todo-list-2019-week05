<!DOCTYPE html>
<html lang="en">

<body>
    <main>
        <div class="tasks">
            <div class="content">
                <h1>Todo App</h1>
                <input type="text" name="textTask" id="textTask">

                <!-- The items to be added -->

                 <h3>You have <span id="itemsLeft">1</span> pending tasks  <input type="button" value="Clear" id="clearButton"></h3>
                 
            </div>
        </div>
    </main>

    <script src="js/index.js"></script>
